name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # Diperlukan agar GitHub Actions bisa membuat Release otomatis

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject API Key ke local.properties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> local.properties
          echo "apiKey=$GEMINI_API_KEY" >> local.properties

      - name: Generate debug.keystore (Mengatasi Error Keystore)
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Siapkan google-services.json & Web Client ID (Mengatasi Error Firebase)
        run: |
          if [ ! -f "app/google-services.json" ]; then
            PKG_NAME=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts || grep -oP 'namespace\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "com.example.app")
            echo "Membuat google-services.json untuk package: $PKG_NAME"
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "dummy-project-id",
              "storage_bucket": "dummy-project-id.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890123456",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789012-dummywebclientid.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "123456789012-dummywebclientid.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Buat Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename File APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/kenali-tanaman-2.0-v1.0.${{ github.run_number }}.apk

      - name: Upload File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kenali-tanaman-2.0-debug
          path: app/build/outputs/apk/debug/kenali-tanaman-2.0-*.apk

      - name: Publikasikan APK ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Rilis Otomatis v1.0.${{ github.run_number }}"
          body: "File APK hasil build otomatis dari commit ${{ github.sha }}. Unduh langsung file `.apk` di bagian Assets di bawah ini."
          files: app/build/outputs/apk/debug/kenali-tanaman-2.0-*.apk

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Inject API Key ke Semua Konfigurasi (local.properties, .env, & Kode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Bersihkan spasi/baris baru yang tidak sengaja ikut ter-copy
          CLEAN_KEY=$(echo "$GEMINI_API_KEY" | tr -d '[:space:]')
          
          if [ -z "$CLEAN_KEY" ]; then
            echo "::error::GEMINI_API_KEY kosong! Pastikan sudah diatur di Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # 1. Tulis ke local.properties, gradle.properties, dan .env
          for FILE in local.properties gradle.properties .env app/.env; do
            echo "GEMINI_API_KEY=$CLEAN_KEY" >> $FILE
            echo "API_KEY=$CLEAN_KEY" >> $FILE
            echo "GOOGLE_API_KEY=$CLEAN_KEY" >> $FILE
            echo "VITE_GEMINI_API_KEY=$CLEAN_KEY" >> $FILE
            echo "apiKey=$CLEAN_KEY" >> $FILE
            echo "geminiApiKey=$CLEAN_KEY" >> $FILE
          done

          # 2. Ganti placeholder API Key jika ada yang di-hardcode di kode Kotlin / Gradle
          find app/ -type f \( -name "*.kt" -o -name "*.kts" -o -name "*.xml" \) -exec sed -i \
            -e "s/YOUR_API_KEY/$CLEAN_KEY/g" \
            -e "s/YOUR_GEMINI_API_KEY/$CLEAN_KEY/g" \
            -e "s/PLACEHOLDER_API_KEY/$CLEAN_KEY/g" \
            -e "s/\"GEMINI_API_KEY\", \"\"/\"GEMINI_API_KEY\", \"\\\\\"$CLEAN_KEY\\\\\"\"/g" {} +

      - name: Generate debug.keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Siapkan google-services.json dengan API Key Asli
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CLEAN_KEY=$(echo "$GEMINI_API_KEY" | tr -d '[:space:]')
          if [ ! -f "app/google-services.json" ]; then
            PKG_NAME=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts || grep -oP 'namespace\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "com.example.app")
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "gen-lang-client-0149877899",
              "storage_bucket": "gen-lang-client-0149877899.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890123456",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789012-dummywebclientid.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "$CLEAN_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "123456789012-dummywebclientid.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Buat Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename File APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/kenali-tanaman-2.0-v1.0.${{ github.run_number }}.apk

      - name: Upload File APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kenali-tanaman-2.0-debug
          path: app/build/outputs/apk/debug/kenali-tanaman-2.0-*.apk

      - name: Publikasikan APK ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Rilis Otomatis v1.0.${{ github.run_number }}"
          body: "File APK hasil build otomatis dari commit ${{ github.sha }}. Unduh langsung file `.apk` di bagian Assets di bawah ini."
          files: app/build/outputs/apk/debug/kenali-tanaman-2.0-*.apk
